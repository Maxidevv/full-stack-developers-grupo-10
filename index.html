<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mueblería Jota - Inicio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
<header class="jh-header">
  <div class="jh-header__container">
    <a href="/" class="jh-header__logo">
      <img src="assets/images/logo.svg" alt="Los Hermanos Jota">
    </a>
    <nav class="jh-header__nav" id="jh-nav">
      <ul>
        <li><a href="/productos.html">Productos</a></li>
          <li><a>|</a></li>
        <li><a href="/sobre.html">Sobre Nosotros</a></li>
          <li><a>|</a></li>
          <li><a href="/contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <div class="jh-header__right">
      <button class="jh-header__cart" id="jh-cart-btn" aria-label="Carrito">
        <span class="jh-header__cart-icon"></span>
        <span class="jh-header__cart-count" id="jh-cart-count">0</span>
      </button>
      <button class="jh-header__burger" id="jh-burger" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<section class="hero-banner" aria-label="Presentación de la mueblería">
  <div class="hero-banner__video-container">
    <video class="hero-banner__video" autoplay muted loop playsinline aria-hidden="true" preload="auto">
      <source src="assets/video/video%20_institucional%20_hermanosjota.mp4" type="video/mp4">
      <!-- Fallback: En caso que el video falle, habra una imagen de backup -->
      <img src="" alt="Muebles: familias creando sus recuerdos" loading="lazy">
    </video>
    <div class="hero-banner__overlay" aria-hidden="true"></div>
    <div class="hero-banner__content">
      <h1>
        "No vendemos madera y tela; vendemos el escenario donde las familias crearán sus mejores recuerdos."
      </h1>
    </div>
  </div>
</section>




    <script src="js/main.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
